<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福岡・由布院・別府 8 日行程</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --paper:#F1F3F5; --card:#FFFFFF; --ink:#172033; --ink2:#4B5568; --line:#D6DCE3;
  --maple:#B3302A; --maple-bg:#F9E8E5; --hero:#1F3358; --on-hero:#F1F3F5; --hero-dim:#B7C3DA;
  --accent:#1F3358; --on-accent:#FFFFFF; --moss:#4F6444; --moss-bg:#E7EEE2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1520; --card:#172033; --ink:#E8ECF2; --ink2:#A7B1C2; --line:#2A3548;
    --maple:#E8695F; --maple-bg:#37191B; --hero:#16223A; --on-hero:#EEF1F6; --hero-dim:#94A5C4;
    --accent:#8FA9DA; --on-accent:#0F1520; --moss:#9DB88F; --moss-bg:#1E2A1D;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1520; --card:#172033; --ink:#E8ECF2; --ink2:#A7B1C2; --line:#2A3548;
  --maple:#E8695F; --maple-bg:#37191B; --hero:#16223A; --on-hero:#EEF1F6; --hero-dim:#94A5C4;
  --accent:#8FA9DA; --on-accent:#0F1520; --moss:#9DB88F; --moss-bg:#1E2A1D;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  line-height:1.65;font-size:16px;-webkit-text-size-adjust:100%}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
a{color:inherit}
:focus-visible{outline:3px solid var(--maple);outline-offset:2px;border-radius:6px}

/* hero */
.hero{background:var(--hero);color:var(--on-hero);padding:28px 20px 22px}
.wrap{max-width:720px;margin:0 auto}
.hero h1{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-weight:900;font-size:clamp(30px,8vw,44px);line-height:1.2;letter-spacing:.04em}
.hero p{margin:10px 0 0;color:var(--hero-dim);font-size:.95rem}
.hero .count{display:inline-block;margin-top:14px;padding:4px 12px;border:1px solid var(--hero-dim);border-radius:99px;font-size:.85rem;color:var(--on-hero)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;max-width:720px;margin:0 auto}
.tablist::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:52px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:12px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab .n{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.2rem}
.tab .w{font-size:.72rem;color:var(--ink2)}
.tab .m{font-size:.72rem;color:var(--ink2)}
.tab.txt{justify-content:center;font-weight:500;font-size:.95rem}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab[aria-selected="true"] .w,.tab[aria-selected="true"] .m{color:inherit;opacity:.85}

main{padding:22px 16px 56px}
.panel[hidden]{display:none}

/* day header */
.dayhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.dayhead .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:76px;line-height:.9;color:var(--maple)}
.daypin{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--maple-bg);color:var(--maple);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding-bottom:6px}
.daypin:hover{background:var(--maple);color:#fff}
.dayhead .sub{padding-bottom:6px}
.dayhead .sub small{display:block;color:var(--ink2);font-size:.9rem}
.dayhead .sub b{font-family:"Noto Serif TC",serif;font-size:1.6rem;font-weight:900;line-height:1.2}
.lead{color:var(--ink2);margin:.6rem 0 1rem}

.alert{background:var(--maple-bg);border-left:4px solid var(--maple);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 12px;font-size:.95rem}
.alert b{color:var(--maple)}
.decide{background:var(--moss-bg);border-left:4px solid var(--moss);padding:10px 14px;border-radius:0 10px 10px 0;margin:0 0 12px;font-size:.95rem}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);
  text-decoration:none;font-weight:500;font-size:.95rem;border:0;cursor:pointer;font-family:inherit}
.btn.block{display:flex;justify-content:center;width:100%;margin:6px 0 20px}
.btn svg,.pin svg{flex:0 0 auto}

.seg{display:flex;gap:6px;margin:0 0 14px}
.seg button{flex:1;padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* timeline */
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:3.3rem 1.5rem 1fr;column-gap:4px}
.stop .t{text-align:right;font-size:.82rem;color:var(--ink2);font-variant-numeric:tabular-nums;padding-top:3px}
.stop .rail{position:relative}
.stop .rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--line);transform:translateX(-50%)}
.stop:first-child .rail::before{top:.7rem}
.stop:last-child .rail::before{bottom:auto;height:.7rem}
.stop .rail::after{content:"";position:absolute;left:50%;top:.42rem;width:12px;height:12px;border-radius:50%;
  background:var(--card);border:3px solid var(--maple);transform:translateX(-50%)}
.stop.go .rail::after{background:var(--accent);border-color:var(--accent)}
.stop .body{padding:0 0 1.25rem 6px}
.stop .ttl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;font-size:1.02rem;line-height:1.4}
.stop .det{color:var(--ink2);font-size:.9rem;margin-top:2px}
.pin{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:500;text-decoration:none;color:var(--maple);
  border:1px solid var(--maple);border-radius:99px;padding:1px 10px 1px 7px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:1rem;font-family:"Noto Serif TC",serif;font-weight:900}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .addr{color:var(--ink2);font-size:.88rem;word-break:break-word}
.card .meta{font-size:.8rem;color:var(--ink2)}
h2.sec{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.15rem;margin:26px 0 10px}
ul.tips{margin:0;padding:0;list-style:none}
ul.tips li{padding:8px 0 8px 22px;position:relative;border-bottom:1px solid var(--line);font-size:.93rem}
ul.tips li:last-child{border-bottom:0}
ul.tips li::before{content:"★";position:absolute;left:0;color:var(--maple);font-size:.8rem;top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);
  text-decoration:none;font-size:.88rem}
.chip svg{color:var(--maple)}

/* flights */
.flight{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.flight .no{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.3rem}
.flight .route{font-weight:500}
.flight .time{color:var(--ink2);font-size:.9rem;grid-column:2}

/* overview day list */
.daylist{list-style:none;margin:0;padding:0}
.daylist button{width:100%;display:grid;grid-template-columns:3.2rem 1fr;gap:10px;text-align:left;align-items:baseline;
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 8px;font:inherit;color:inherit;cursor:pointer}
.daylist .d{font-family:"Noto Serif TC",serif;font-weight:900;color:var(--maple);font-size:1.1rem}
.daylist .a{font-weight:700}
.daylist .s{display:block;font-size:.83rem;color:var(--ink2);font-weight:400}
.todo{list-style:none;margin:0;padding:0}
.todo li{padding:8px 0 8px 26px;position:relative;border-bottom:1px solid var(--line);font-size:.93rem}
.todo li:last-child{border-bottom:0}
.todo li::before{content:"";position:absolute;left:2px;top:12px;width:13px;height:13px;border:2px solid var(--ink2);border-radius:4px}
.x{display:none;flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--maple);font-size:.8rem;line-height:1;cursor:pointer;padding:0;margin-left:auto}
body.editing .x{display:inline-flex;align-items:center;justify-content:center}
.chip{padding:0}
.chip a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;padding:6px 12px}
.chip .x{width:24px;height:24px;margin:0 6px 0 -6px}
a.chip{padding:6px 12px}
ul.tips li{display:flex;gap:8px;align-items:flex-start}
ul.tips li span{flex:1}
ul.tips li .x{margin-top:2px}
.editbtn{margin:14px 0 0 8px;padding:4px 14px;border:1px solid var(--hero-dim);border-radius:99px;background:transparent;color:var(--on-hero);font:inherit;font-size:.85rem;cursor:pointer}
.editbar{background:var(--moss-bg);border-left:4px solid var(--moss);border-radius:0 10px 10px 0;padding:10px 14px;margin:0 0 16px;font-size:.92rem}
.editbar p{margin:0 0 8px}
.editbar .saved{margin:8px 0 0;color:var(--ink2);font-size:.82rem}
.editbar .acts{display:flex;flex-wrap:wrap;gap:8px}
.editbar button{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer}
.editbar button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.editbar button:disabled{opacity:.45;cursor:default}
.spend .exl{list-style:none;margin:0 0 8px;padding:0}
.spend .exl li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.cat{font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--moss-bg);color:var(--moss);white-space:nowrap}
.nm{word-break:break-word}
.am{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.rm{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--maple);cursor:pointer;font-size:.75rem;padding:0}
.tot{text-align:right;padding:6px 0 14px}
.exform{display:grid;gap:8px}
.exform input,.exform select,.money input,.money select{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.r2{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.exform .btn{justify-content:center}
.lodge{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.rate{display:flex;align-items:center;gap:8px}
.rate input{width:7rem}
.bigtot{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.5rem;color:var(--maple);margin-bottom:6px}
.daylist button.c3{grid-template-columns:3.2rem 1fr auto}
.r2{grid-template-columns:1fr auto}
.r3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lodge{grid-template-columns:1fr auto auto}
.nm small{display:block;color:var(--ink2);font-size:.78rem}
.am small{display:block;color:var(--ink2);font-size:.78rem;font-weight:400;text-align:right}
.spend .exl.settle li{grid-template-columns:1fr auto}
.am.plus{color:var(--moss)}
.am.minus{color:var(--maple)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);max-width:90%;background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:99px;font-size:.9rem;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
.toast.show{opacity:1}
.toast.bad{background:var(--maple);color:#fff}
.backup textarea{display:block;width:100%;margin:4px 0 8px;font:inherit;font-size:14px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.backup label{display:block;margin-top:12px}
.mini{padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;cursor:pointer}
.efrm{display:grid;gap:8px;margin:0 0 14px}
.efrm input,.efrm textarea{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:100%}
.efrm .acts{display:flex;gap:8px}
.mini.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.r2t{display:grid;grid-template-columns:5.5rem 1fr;gap:8px}
.editonly{display:none}
body.editing .editonly{display:block}
.addbtn{display:none;margin:2px 0 14px}
body.editing .addbtn{display:inline-block}
.toggler{margin-left:auto;align-self:flex-start}
body.editing .toggler{display:none}
.tgl{display:flex;justify-content:flex-end}
.x.ed{margin-left:auto}
.x.ed + .x{margin-left:0}
.x.inl{margin-left:6px;vertical-align:middle}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead .sec{margin:22px 0 8px}
.macts{display:flex;gap:6px}
.macts .x{margin-left:0}
.tips li.tipedit{display:block;padding-left:0}
.tips li.tipedit::before{content:none}
/* map compare */
.mapcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden}
.maphead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}
.maphead b{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1rem}
.mapsel{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.mapsel::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;max-width:15em;padding:5px 12px 5px 6px;border-radius:99px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip:first-child:not(:has(.no)){padding-left:12px}
.mchip .no{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--maple);color:var(--card);font-size:.72rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.mchip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mchip[aria-pressed="true"] .no{background:var(--on-accent);color:var(--accent)}
.mapbox{position:relative;height:min(70vw,360px);min-height:240px;background:var(--paper);border-top:1px solid var(--line)}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;font-size:.85rem;color:var(--ink2);border-top:1px solid var(--line)}
.mlink{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--maple-bg);color:var(--maple);text-decoration:none;font-weight:500;font-size:.85rem}
.mlink:hover{background:var(--maple);color:var(--card)}
.mnum{position:relative;flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:0;background:var(--maple);color:var(--card);font:inherit;font-size:.78rem;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.mnum::after{content:"";position:absolute;inset:-8px}
.mnum[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

/* metro */
.metro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2px 16px;margin:0 0 12px}
.mrow{display:grid;grid-template-columns:4.2rem 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}
.mrow:last-child{border-bottom:0}
.mrow .mt{font-weight:700;font-size:.95rem;line-height:1.45}
.mrow .md{color:var(--ink2);font-size:.88rem;margin-top:2px}
.lb{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:1px 8px;border-radius:99px;font-size:.76rem;font-weight:700;color:#fff;white-space:nowrap;text-align:center}
.lb.K{background:#C2570A}.lb.H{background:#1F6FB5}.lb.N{background:#2A8A4F}
.lb.JR{background:#3B5B92}.lb.NT{background:#8A3A76}.lb.BUS{background:#7A6420}
.lb.TIP{background:var(--moss-bg);color:var(--moss);border:1px solid var(--moss)}
.ln-K{--lc:#C2570A}.ln-H{--lc:#1F6FB5}.ln-N{--lc:#2A8A4F}
.lnrow{padding:12px 0;border-bottom:1px solid var(--line)}
.lnrow:last-child{border-bottom:0}
.lnhead{display:flex;align-items:center;gap:10px}
.lnhead small{color:var(--ink2);font-size:.82rem}
ol.chain{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;row-gap:6px}
.chain li{display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:.86rem;color:var(--ink2)}
.chain li::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--lc);opacity:.55}
.chain li.on::before{width:11px;height:11px;opacity:1}
.chain li.gap::before{display:none}
.chain li.on{color:var(--ink);font-weight:700}
.chain li small{font-size:.7rem;font-weight:400;color:var(--ink2)}
footer{color:var(--ink2);font-size:.8rem;text-align:center;padding:10px 16px 30px}
@media (min-width:600px){ main{padding-top:32px} .stop{grid-template-columns:4rem 1.6rem 1fr} }
@media (prefers-reduced-motion: no-preference){ .panel{animation:fade .18s ease-out} @keyframes fade{from{opacity:.4}to{opacity:1}} }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div id="heroTitle"></div>
    <span class="count" id="count" hidden></span>
    <button type="button" class="editbtn" id="editBtn">編輯行程</button>
  </div>
</header>

<nav class="tabs" aria-label="行程分頁">
  <div class="tablist" role="tablist" id="tablist"></div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<main><div class="wrap">
  <div class="editbar" id="editbar" hidden>
    <p><b>編輯模式：</b>點景點旁的 ✕ 就能刪除，改動會自動儲存。</p>
    <div class="acts">
      <button type="button" id="undoBtn">復原上一步</button>
      <button type="button" id="resetPage">還原本頁</button>
      <button type="button" id="resetAll">全部還原</button>
      <button type="button" id="doneBtn" class="pri">完成</button>
    </div>
    <p class="saved" id="saved" role="status">尚未有改動。</p>
  </div>
  <div id="panels"></div>
</div></main>
<footer>地圖按鈕會開啟 Google Maps，內嵌地圖需要網路連線。地鐵票價與時間為 2026 年 10 月查得的資料，出發前請再確認。刪減與花費紀錄都只存在這台裝置的瀏覽器裡。</footer>

<script>
(function(){
  /* ---------- helpers ---------- */
  var PIN = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>';
  var ROUTE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/></svg>';

      return '<li>' + esc(t) + ' <button type="button" class="x ed inl" data-edit="' + k + '" aria-label="編輯待辦">✎</button>' + xbtn(k, '待辦') + '</li>';
    }).join('') + '</ul><button type="button" class="mini addbtn" data-addtodo>＋新增待辦</button></div>';
    h += '<h2 class="sec">每日行程</h2><ul class="daylist">' + DAYS.map(function(d){
      var first = alive(d.plans ? d.plans[0].stops : d.stops, d.id + '|0').filter(function(o){return o.s.q;}).slice(0,3).map(function(o){return o.s.n;}).join('、');
      return '<li><button type="button" data-go="' + d.id + '"><span class="d">' + d.date + '</span><span><span class="a">週' + d.dow + '　' + esc(dayArea(d)) + '</span><span class="s">' + first + '</span></span></button></li>';
    }).join('') + '</ul>';
    return h + '</section>';
  }

  var HERO0 = {title:'福岡・由布院・別府', subtitle:'2026 年 11 月 14 日至 21 日，7 晚。弘、安、錚、涵同行。'};
  function heroData(){ var o = content.heroOvr || {}; return {title:o.title!==undefined?o.title:HERO0.title, subtitle:o.subtitle!==undefined?o.subtitle:HERO0.subtitle}; }
  function renderHero(){
    var el = document.getElementById('heroTitle'), hd = heroData(), k = 'hero';
    if(editKey === k){
      el.innerHTML = '<form class="efrm heroform" style="margin:0"><input name="title" maxlength="40" placeholder="標題" required value="' + esc(hd.title) + '" aria-label="標題" style="font-size:1.3rem;font-weight:900">' +
        '<input name="subtitle" maxlength="80" placeholder="副標題" value="' + esc(hd.subtitle) + '" aria-label="副標題">' +
        '<div class="acts"><button type="submit" class="mini pri">儲存</button><button type="button" class="mini" data-cancel>取消</button></div></form>';
    } else {
      el.innerHTML = '<h1>' + esc(hd.title) + ' <button type="button" class="x ed inl" data-edit="' + k + '" aria-label="編輯標題" style="color:var(--hero-dim);border-color:var(--hero-dim)">✎</button></h1><p>' + esc(hd.subtitle) + '</p>';
    }
  }

  var panels = document.getElementById('panels');
  var cur = 'ov';

  /* ---------- tabs ---------- */
  var tabDefs = [{id:'ov', html:'總覽', cls:'txt'}].concat(DAYS.map(function(d){
    return {id:d.id, html:'<span class="m">11 月</span><span class="n">' + d.n + '</span><span class="w">' + d.dow + '</span>'};
  })).concat([{id:'cost', html:'花費', cls:'txt'}, {id:'memo', html:'備忘', cls:'txt'}]);
  var tablist = document.getElementById('tablist');
  tablist.innerHTML = tabDefs.map(function(t){
    return '<button class="tab ' + (t.cls || '') + '" role="tab" type="button" data-tab="' + t.id + '" aria-controls="' + t.id + '" aria-selected="false">' + t.html + '</button>';
  }).join('');
  var tabEls = Array.prototype.slice.call(tablist.querySelectorAll('.tab'));

  function show(id, push, keep){
    if(!document.getElementById(id)) id = 'ov';
    cur = id;
    tabEls.forEach(function(b){
      var on = b.getAttribute('data-tab') === id;
      b.setAttribute('aria-selected', on);
      b.tabIndex = on ? 0 : -1;
      if(on && !keep){ try{ b.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){} }
    });
    Array.prototype.forEach.call(panels.querySelectorAll('.panel'), function(p){ p.hidden = p.id !== id; });
    loadMaps();
    if(push){ try{ history.replaceState(null, '', '#' + id); }catch(e){} }
    if(!keep) window.scrollTo(0, 0);
  }
  function renderAll(){
    renderHero();
    panels.innerHTML = overviewHtml() + DAYS.map(dayHtml).join('') + costHtml() + memoHtml();
    show(cur, false, true);
    updateBar();
  }

  /* ---------- edit + save ---------- */
  var KEY = 'fukuoka-trip-edits-v1';
  var del = {}, undo = [], planSel = {}, editing = false, resetArmed = false, resetTimer = 0;
  try{ var raw = localStorage.getItem(KEY); if(raw) del = JSON.parse(raw) || {}; }catch(e){ del = {}; }

  var bar = document.getElementById('editbar'), savedEl = document.getElementById('saved'),
      editBtn = document.getElementById('editBtn'), resetBtn = document.getElementById('resetAll'),
      undoBtn = document.getElementById('undoBtn'), pageBtn = document.getElementById('resetPage');
  function persist(){
    try{
      localStorage.setItem(KEY, JSON.stringify(del));
      var t = new Date();
      savedEl.textContent = '已儲存於這台裝置（' + t.getHours() + ':' + ('0' + t.getMinutes()).slice(-2) + '）';
    }catch(e){ savedEl.textContent = '無法儲存：瀏覽器封鎖了儲存功能，重新開啟後會還原。'; }
  }
  function updateBar(){
    var n = Object.keys(del).length + contentCount();
    document.body.classList.toggle('editing', editing);
    bar.hidden = !editing;
    editBtn.textContent = editing ? '完成編輯' : (n ? '編輯行程（已改 ' + n + ' 項）' : '編輯行程');
    undoBtn.disabled = !undo.length;
    resetBtn.disabled = !n;
    pageBtn.disabled = !Object.keys(del).some(function(k){ return k.indexOf(cur + '|') === 0; }) && !pageKeys(cur);
  }
  function disarm(){ resetArmed = false; clearTimeout(resetTimer); resetBtn.textContent = '全部還原'; }
  editBtn.addEventListener('click', function(){ editing = !editing; editKey = null; disarm(); renderAll(); });
  document.getElementById('doneBtn').addEventListener('click', function(){ editing = false; editKey = null; disarm(); renderAll(); });
  undoBtn.addEventListener('click', function(){ var k = undo.pop(); if(k){ delete del[k]; persist(); renderAll(); } });
  pageBtn.addEventListener('click', function(){
    Object.keys(del).forEach(function(k){ if(k.indexOf(cur + '|') === 0) delete del[k]; });
    undo = []; clearContentPage(cur); persist(); renderAll();
  });
  resetBtn.addEventListener('click', function(){
    if(!resetArmed){ resetArmed = true; resetBtn.textContent = '再按一次確認'; resetTimer = setTimeout(disarm, 4000); return; }
    del = {}; undo = []; content = normContent(null); saveContent(); disarm(); persist(); renderAll();
  });

  tablist.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if(b){ show(b.getAttribute('data-tab'), true); updateBar(); }
  });
  tablist.addEventListener('keydown', function(e){
    var i = tabEls.indexOf(document.activeElement);
    if(i < 0) return;
    if(e.key === 'ArrowRight' && tabEls[i+1]){ tabEls[i+1].focus(); tabEls[i+1].click(); e.preventDefault(); }
    if(e.key === 'ArrowLeft' && tabEls[i-1]){ tabEls[i-1].focus(); tabEls[i-1].click(); e.preventDefault(); }
  });
  panels.addEventListener('click', function(e){
    var x = e.target.closest('[data-del]');
    if(x){
      var k = x.getAttribute('data-del');
      del[k] = 1; undo.push(k); persist(); renderAll(); return;
    }
    var g = e.target.closest('[data-go]');
    if(g){ show(g.getAttribute('data-go'), true); updateBar(); return; }
    var pb = e.target.closest('.seg button');
    if(pb){
      var sec = pb.closest('.panel'), idx = pb.getAttribute('data-plan');
      planSel[sec.id] = +idx;
      Array.prototype.forEach.call(sec.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed', b === pb); });
      Array.prototype.forEach.call(sec.querySelectorAll('.plan'), function(p){ p.hidden = p.getAttribute('data-plan') !== idx; });
    }
  });

  panels.addEventListener('click', function(e){
    var m = e.target.closest('[data-mapi]');
    if(m){ selectMap(m.getAttribute('data-mapday'), +m.getAttribute('data-mapi'), m.classList.contains('mnum')); return; }
    var tg = e.target.closest('[data-maptoggle]');
    if(tg){
      var mid = tg.getAttribute('data-maptoggle'), card = panels.querySelector('[data-mapcard="' + mid + '"]');
      if(!card) return;
      var body = card.querySelector('.mapbody');
      mapOff[mid] = !body.hidden;
      body.hidden = mapOff[mid];
      tg.textContent = mapOff[mid] ? '展開地圖' : '收合地圖';
      tg.setAttribute('aria-expanded', String(!mapOff[mid]));
      if(!mapOff[mid]) loadMaps();
    }
  });
  panels.addEventListener('click', function(e){
    var r = e.target.closest('[data-rmexp]');
    if(!r) return;
    var p = r.getAttribute('data-rmexp').split('|');
    money.exp[p[0]] = (money.exp[p[0]] || []).filter(function(x){ return x.id !== p[1]; });
    commit('已刪除這筆花費');
  });
  panels.addEventListener('click', function(e){
    var c = e.target.closest('[data-copy]');
    if(c){
      var el = document.getElementById(c.getAttribute('data-copy'));
      if(!el) return;
      el.focus(); el.select();
      var done = function(){ toast('✓ 已複製'); };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(el.value).then(done, function(){ document.execCommand('copy') ? done() : toast('請長按文字手動複製', true); }); }
        else if(document.execCommand('copy')){ done(); } else { toast('請長按文字手動複製', true); }
      }catch(err){ toast('請長按文字手動複製', true); }
      return;
    }
    var a = e.target.closest('[data-act]');
    if(!a) return;
    if(a.getAttribute('data-act') === 'export'){ backupOpen = true; renderAll(); return; }
    if(a.getAttribute('data-act') === 'import'){
      var txt = (document.getElementById('jsonIn').value || '').trim();
      try{
        var o = JSON.parse(txt), m = o && o.money ? o.money : o;
        if(!m || typeof m !== 'object' || typeof m.exp !== 'object') throw new Error('bad');
        money.rate = +m.rate > 0 ? +m.rate : money.rate;
        money.hotels = m.hotels || {};
        money.exp = m.exp || {};
        if(o.money){ del = o.del || {}; content = normContent(o.content); saveContent(); persist(); }
        commit('已還原備份');
      }catch(err){ toast('備份碼格式不正確', true); }
    }
  });
  panels.addEventListener('submit', function(e){
    var f = e.target.closest('.exform'); if(!f) return;
    e.preventDefault();
    var a = parseFloat(f.elements.a.value);
    if(!(a > 0)) return;
    var day = f.getAttribute('data-day');
    (money.exp[day] = money.exp[day] || []).push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      n: f.elements.n.value.trim(), a: a, c: f.elements.c.value, cat: f.elements.cat.value, p: f.elements.p.value, ts: Date.now()
    });
    lastPayer = f.elements.p.value;
    commit('已儲存這筆花費');
    var inp = panels.querySelector('#' + day + ' input[name="n"]');
    if(inp){ try{ inp.focus({preventScroll:true}); }catch(err){} }
  });
  panels.addEventListener('change', function(e){
    var t = e.target;
    if(t.hasAttribute('data-rate')){
      var r = parseFloat(t.value); if(r > 0){ money.rate = r; commit('已儲存匯率'); }
    } else if(t.hasAttribute('data-hotel')){
      var i = t.getAttribute('data-hotel'), h = money.hotels[i] || {a:0, c:'JPY'};
      h.a = Math.max(0, parseFloat(t.value) || 0); money.hotels[i] = h; commit('已儲存住宿費用');
    } else if(t.hasAttribute('data-hotelp')){
      var k = t.getAttribute('data-hotelp'), q = money.hotels[k] || {a:0, c:'JPY'};
      q.p = t.value; money.hotels[k] = q; commit('已儲存付款人');
    } else if(t.hasAttribute('data-hotelc')){
      var j = t.getAttribute('data-hotelc'), g = money.hotels[j] || {a:0, c:'JPY'};
      g.c = t.value; money.hotels[j] = g; commit('已儲存幣別');
    }
  });

  function openForm(key){
    editKey = key; renderAll();
    var f = document.querySelector('.efrm input, .efrm textarea');
    if(f){ try{ f.focus({preventScroll:false}); }catch(err){} }
  }
  panels.addEventListener('click', function(e){
    var t = e.target;
    if(t.closest('[data-toggle-edit]')){ editing = true; disarm(); renderAll(); return; }
    var ed = t.closest('[data-edit]');
    if(ed){ openForm(ed.getAttribute('data-edit')); return; }
    if(t.closest('[data-cancel]')){ editKey = null; renderAll(); return; }
    var as = t.closest('[data-addstop]');
    if(as){
      var pre = as.getAttribute('data-addstop'), base = baseStops(pre), arr = (content.add[pre] = content.add[pre] || []);
      arr.push({n:'新景點', t:'', d:'', q:''});
      saveContent(); openForm(pre + '|' + (base.length + arr.length - 1)); return;
    }
    var at = t.closest('[data-addtip]');
    if(at){
      var id = at.getAttribute('data-addtip'), day = DAYS.filter(function(x){ return x.id === id; })[0], ta = (content.tipAdd[id] = content.tipAdd[id] || []);
      ta.push({t:'新提醒', q:''});
      saveContent(); openForm(id + '|t|' + ((day.tips || []).length + ta.length - 1)); return;
    }
    if(t.closest('[data-addmemo]')){
      var arr2 = memoArr(), nid = 'm' + Date.now().toString(36);
      arr2.push({id:nid, title:'新備忘', body:'', links:''});
      saveContent(); openForm('memo|' + nid); return;
    }
    var aa = t.closest('[data-addalert]');
    if(aa){
      var aid = aa.getAttribute('data-addalert'), al = (content.alertAdd[aid] = content.alertAdd[aid] || []);
      al.push('新提醒');
      saveContent();
      var day = DAYS.filter(function(x){ return x.id === aid; })[0];
      openForm(aid + '|a|' + ((day.alerts || []).length + al.length - 1)); return;
    }
    var af = t.closest('[data-addfood]');
    if(af){
      var fid = af.getAttribute('data-addfood'), fl2 = (content.foodAdd[fid] = content.foodAdd[fid] || []);
      fl2.push(['新美食','']);
      saveContent();
      var day2 = DAYS.filter(function(x){ return x.id === fid; })[0];
      openForm(fid + '|f|' + ((day2.foods || []).length + fl2.length - 1)); return;
    }
    if(t.closest('[data-addtodo]')){
      var tl2 = (content.todoAdd = content.todoAdd || []);
      tl2.push('新待辦');
      saveContent(); openForm('ov|td|' + (TODO0.length + tl2.length - 1)); return;
    }
    var md = t.closest('[data-memodel]');
    if(md){
      var mid = md.getAttribute('data-memodel');
      content.memo = memoArr().filter(function(b){ return b.id !== mid; });
      commitContent('已刪除備忘');
    }
  });
  panels.addEventListener('submit', function(e){
    var f = e.target, v;
    if(f.classList.contains('stopform')){
      e.preventDefault();
      content.ovr[f.getAttribute('data-key')] = {t:f.elements.t.value.trim(), n:f.elements.n.value.trim() || '未命名', d:f.elements.d.value.trim(), q:f.elements.q.value.trim()};
      editKey = null; commitContent('已儲存景點');
    } else if(f.classList.contains('tipform')){
      e.preventDefault();
      content.tipOvr[f.getAttribute('data-key')] = {t:f.elements.t.value.trim(), q:f.elements.q.value.trim()};
      editKey = null; commitContent('已儲存提醒');
    } else if(f.classList.contains('leadform')){
      e.preventDefault();
      content.lead[f.getAttribute('data-day')] = f.elements.t.value.trim();
      editKey = null; commitContent('已儲存說明');
    } else if(f.classList.contains('memoform')){
      e.preventDefault();
      var mid = f.getAttribute('data-id');
      memoArr().forEach(function(b){ if(b.id === mid){ b.title = f.elements.title.value.trim() || '備忘'; b.body = f.elements.body.value; b.links = f.elements.links.value; } });
      editKey = null; commitContent('已儲存備忘');
    } else if(f.classList.contains('hotelform')){
      e.preventDefault();
      var hi = f.getAttribute('data-i');
      content.hotelOvr[hi] = {name:f.elements.name.value.trim(), dates:f.elements.dates.value.trim(), area:f.elements.area.value.trim(), addr:f.elements.addr.value, note:f.elements.note.value, q:f.elements.q.value.trim()};
      editKey = null; commitContent('已儲存住宿');
    } else if(f.classList.contains('areaform')){
      e.preventDefault();
      content.areaOvr[f.getAttribute('data-day')] = f.elements.a.value.trim();
      editKey = null; commitContent('已儲存區域名');
    } else if(f.classList.contains('alertform')){
      e.preventDefault();
      content.alertOvr[f.getAttribute('data-key')] = f.elements.t.value;
      editKey = null; commitContent('已儲存提醒');
    } else if(f.classList.contains('decideform')){
      e.preventDefault();
      content.decideOvr[f.getAttribute('data-day')] = f.elements.t.value;
      editKey = null; commitContent('已儲存決策');
    } else if(f.classList.contains('foodform')){
      e.preventDefault();
      var fk = f.getAttribute('data-key');
      content.foodOvr[fk] = {n:f.elements.n.value.trim(), q:f.elements.q.value.trim()};
      editKey = null; commitContent('已儲存美食');
    } else if(f.classList.contains('flightform')){
      e.preventDefault();
      content.flightOvr[f.getAttribute('data-i')] = {no:f.elements.no.value.trim(), route:f.elements.route.value.trim(), time:f.elements.time.value.trim()};
      editKey = null; commitContent('已儲存航班');
    } else if(f.classList.contains('todoform')){
      e.preventDefault();
      content.todoOvr['ov|td|' + f.getAttribute('data-i')] = f.elements.t.value;
      editKey = null; commitContent('已儲存待辦');
    } else if(f.classList.contains('heroform')){
      e.preventDefault();
      content.heroOvr = {title:f.elements.title.value.trim() || HERO0.title, subtitle:f.elements.subtitle.value};
      editKey = null; commitContent('已儲存標題');
    }
  });

  var heroEl = document.getElementById('heroTitle');
  heroEl.addEventListener('click', function(e){
    var t = e.target;
    var ed = t.closest('[data-edit]'); if(ed){ openForm(ed.getAttribute('data-edit')); return; }
    if(t.closest('[data-cancel]')){ editKey = null; renderAll(); return; }
  });
  heroEl.addEventListener('submit', function(e){
    var f = e.target;
    if(f.classList.contains('heroform')){
      e.preventDefault();
      content.heroOvr = {title:f.elements.title.value.trim() || HERO0.title, subtitle:f.elements.subtitle.value};
      editKey = null; commitContent('已儲存標題');
    }
  });

  try{ if(location.hash) cur = location.hash.slice(1); }catch(e){}
  renderAll();
  if(Object.keys(del).length) savedEl.textContent = '已載入你之前儲存的刪減。';

  /* ---------- countdown ---------- */
  var c = document.getElementById('count');
  var now = new Date(), dep = new Date(2026, 10, 14), ret = new Date(2026, 10, 21, 23, 59);
  var days = Math.ceil((dep - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
  if(days > 0){ c.textContent = '距離出發還有 ' + days + ' 天'; c.hidden = false; }
  else if(now <= ret){ c.textContent = '旅程進行中'; c.hidden = false; }
})();
</script>
</body>
</html>
